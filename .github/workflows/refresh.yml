name: Refresh knowledge

# Re-crawls the ITU website weekly and syncs it (plus the handbook) into
# Vectorize. Only changed pages are re-embedded. The run commits the updated
# manifest back, which also keeps the repo "active" so GitHub never pauses
# this schedule.
on:
  schedule:
    - cron: "17 21 * * 6"   # Sundays 02:17 Pakistan time
  push:
    branches: [main]
    paths: ["data/handbook.md", "data/extra_urls.txt", "ingest/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Re-embed everything (use if the index was deleted or recreated)"
        type: boolean
        default: false

concurrency: refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Unit tests
        run: python -m pytest ingest -q

      - name: Refresh
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ITU_LINKS: ${{ vars.ITU_LINKS }}
        run: python ingest/refresh.py ${{ inputs.full && '--full' || '' }}

      - name: Commit manifest
        run: |
          git config user.name "watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index_manifest.json data/last_refresh.json
          git commit -m "chore: knowledge refresh $(date -u +%F)" || exit 0
          git pull --rebase --autostash
          git push
